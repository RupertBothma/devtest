# =============================================================================
# Default values for fastapi-app Helm chart
# =============================================================================
# These values can be overridden using --set or -f values-override.yaml
# =============================================================================

# -- Number of replicas for the deployment
replicaCount: 1

# -- Container image configuration
image:
  # -- Image repository (update with your GHCR path)
  repository: ghcr.io/rupertbothma/devtest
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Image tag (defaults to chart appVersion if not set)
  tag: "latest"

# -- Image pull secrets for private registries
imagePullSecrets: []

# -- Override the chart name
nameOverride: ""
# -- Override the full name
fullnameOverride: ""

# -- Service account configuration
serviceAccount:
  create: false
  name: ""

# -- Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# -- Container security context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# -- Service configuration
service:
  # -- Service type (ClusterIP, NodePort, LoadBalancer)
  type: ClusterIP
  # -- Service port
  port: 8080
  # -- Container port
  targetPort: 8080

# -- Ingress configuration
ingress:
  # -- Enable ingress
  enabled: false
  # -- Ingress class name (nginx for Docker Desktop)
  className: "nginx"
  # -- Ingress annotations
  annotations: {}
  # -- Ingress hosts configuration
  hosts:
    - host: fastapi.local
      paths:
        - path: /
          pathType: Prefix
  # -- TLS configuration
  tls: []

# -- Resource requests and limits
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# -- Horizontal Pod Autoscaler configuration
autoscaling:
  # -- Enable HPA
  enabled: false
  # -- Minimum replicas
  minReplicas: 1
  # -- Maximum replicas
  maxReplicas: 3
  # -- Target CPU utilization percentage
  targetCPUUtilizationPercentage: 80

# -- Liveness probe configuration
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# -- Readiness probe configuration
readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# -- Node selector for pod scheduling
nodeSelector: {}

# -- Tolerations for pod scheduling
tolerations: []

# -- Affinity rules for pod scheduling
affinity: {}

# =============================================================================
# Application Configuration
# =============================================================================

# -- Application environment variables (non-sensitive)
config:
  APP_NAME: "awesome-api"
  APP_ENV: "production"
  APP_VERSION: "0.1.0"

# -- Sensitive configuration (stored in Secret)
# WARNING: For production, use external secret management (e.g., External Secrets, Sealed Secrets)
secrets:
  SECRET_KEY: "change-me-in-production"
